plugins {
    id 'com.android.application'
}

// Release signing: read from environment variables (set by the GitHub workflow from repository secrets).
// Without them, release builds fall back to the debug key so local builds still work.
def ksFile = System.getenv('AUGE_KEYSTORE_FILE')

android {
    namespace 'io.github.krtrttx.auge'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.krtrttx.auge'
        minSdk 24          // Android 7.0
        targetSdk 34
        versionCode 2
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('AUGE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AUGE_KEY_ALIAS')
                keyPassword System.getenv('AUGE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Serves auge.html from the app assets via a secure https origin
    implementation 'androidx.webkit:webkit:1.11.0'
}
