# Builds the APK on GitHub.
#  - every push: APK as a build artifact (Actions tab > run > Artifacts > "auge-apk")
#  - pushing a tag like v1.0.0: additionally publishes a GitHub Release with the APK attached
name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.AUGE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/auge.keystore"
          echo "AUGE_KEYSTORE_FILE=$RUNNER_TEMP/auge.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          AUGE_KEYSTORE_PASSWORD: ${{ secrets.AUGE_KEYSTORE_PASSWORD }}
          AUGE_KEY_ALIAS: ${{ secrets.AUGE_KEY_ALIAS }}
          AUGE_KEY_PASSWORD: ${{ secrets.AUGE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew   # browser uploads drop the executable bit
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Auge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: auge-apk
          path: Auge.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Auge.apk
          generate_release_notes: true
